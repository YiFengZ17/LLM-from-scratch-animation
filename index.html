<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPA · Code Programming Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/viz.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<script src="js/themes.js"></script>

<!-- 展厅：首页和课程页，由 js/site.js 生成 -->
<div class="site" id="site" hidden></div>

<!-- 工作间：编辑器 -->
<div class="app" id="app" hidden>
  <header class="titlebar">
    <button class="tb-btn tb-menu" id="btn-outline" type="button" aria-label="目录" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
    </button>
    <a class="tb-home" id="btn-course" href="#" aria-label="返回课程页"><span class="tb-logo">CPA</span><span class="tb-back">← 课程</span></a>
    <div class="title">
      <span class="title-name" id="course-name"></span>
      <span class="title-sub" id="chapter-name"></span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btn-mode" type="button" aria-label="切换深色和浅色">
        <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.9"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M3.5 12.5l1.1-1.1M11.4 4.6l1.1-1.1"/></svg>
      </button>
      <button class="tb-btn tb-theme" id="btn-theme-top" type="button" aria-label="选择颜色主题">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8a6.2 6.2 0 1 0 0 12.4c1 0 1.4-.6 1.4-1.2 0-.9-.8-1.1-.8-2 0-.7.6-1.2 1.4-1.2h1.5a2.7 2.7 0 0 0 2.7-2.7C14.2 4.1 11.4 1.8 8 1.8z"/><circle cx="5" cy="7.4" r=".8" fill="currentColor" stroke="none"/><circle cx="7.2" cy="4.7" r=".8" fill="currentColor" stroke="none"/><circle cx="10.4" cy="5.2" r=".8" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
  </header>

  <div class="activity">
    <a class="activity-btn" id="btn-home" href="#home" aria-label="回到首页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>
    </a>
    <button class="activity-btn" id="btn-explorer" type="button" aria-label="显示或隐藏目录" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 3H7v15h12V7.5L14.5 3z"/><path d="M14.5 3v4.5H19"/><path d="M7 7H4v14h11v-3"/></svg>
    </button>
    <button class="activity-btn" id="btn-notes" type="button" aria-label="打开前置知识" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.4 5 8 4.5 4.5 4.5v13c3.5 0 5.9.5 7.5 2 1.6-1.5 4-2 7.5-2v-13C16 4.5 13.6 5 12 6.5z"/><path d="M12 6.5v13"/></svg>
    </button>
    <span class="activity-gap"></span>
    <button class="activity-btn" id="btn-theme" type="button" aria-label="选择颜色主题">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-.9 2-1.7 0-1.3-1.1-1.6-1.1-2.9 0-1 .9-1.8 2-1.8H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.6" cy="11" r="1.1" fill="currentColor" stroke="none"/><circle cx="10.8" cy="7.1" r="1.1" fill="currentColor" stroke="none"/><circle cx="15.4" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>

  <nav class="sidebar" id="sidebar" aria-label="目录">
    <div class="side-label" id="side-label">目录</div>
    <ol class="outline" id="outline"></ol>
  </nav>
  <button class="scrim" id="scrim" type="button" aria-label="关闭目录" tabindex="-1"></button>

  <main class="editor">
    <div class="tabs" id="tabs" role="tablist" aria-label="文件"></div>
    <div class="crumbs" id="crumbs" aria-label="当前位置"></div>
    <div class="code-wrap" id="code-wrap">
      <div class="code is-idle" id="code" aria-label="代码"></div>
      <div class="minimap" id="minimap" aria-hidden="true"><canvas id="minimap-canvas"></canvas><div class="minimap-view" id="minimap-view"></div></div>
    </div>
    <article class="doc" id="doc" hidden></article>
    <section class="terminal" id="terminal" aria-label="终端" hidden>
      <div class="term-head"><span>问题</span><span>输出</span><span class="is-on">终端</span></div>
      <div class="term-body" id="term-body"></div>
    </section>

  </main>

  <aside class="narr" aria-label="旁白">
    <div class="narr-head"><span>旁白</span><span id="narr-count"></span></div>
    <div class="narr-scroll" id="narr-scroll">
      <div class="narr-eyebrow" id="narr-section"></div>
      <h1 class="narr-title" id="narr-title"></h1>
      <div class="narr-body" id="narr-body"></div>
      <ol class="thoughts" id="thoughts" aria-label="思路" hidden></ol>
      <section class="refs" id="refs" hidden></section>
    </div>
    <div class="narr-foot">
      <ol class="phases" id="phases" aria-label="这一页的进度">
        <li data-phase="reading">读旁白</li>
        <li data-phase="typing">看代码</li>
        <li data-phase="done">写完</li>
      </ol>
      <div class="narr-nav">
        <button class="btn btn-quiet" id="btn-back" type="button">上一步</button>
        <button class="btn btn-quiet" id="btn-pause" type="button" aria-pressed="false" disabled>暂停</button>
        <button class="btn btn-go" id="btn-go" type="button"><span class="btn-fill" id="btn-fill"></span><span class="btn-label" id="btn-go-label">下一步</span></button>
      </div>
      <div class="keys" aria-hidden="true"><span><kbd>→</kbd>继续</span><span><kbd>←</kbd>上一步</span><span><kbd>P</kbd>暂停</span><span><kbd>T</kbd>主题</span></div>
    </div>
  </aside>

  <footer class="statusbar">
    <span id="status-file"></span>
    <span id="status-pos"></span>
    <span class="status-desktop" id="status-lang"></span>
    <span class="status-spacer"></span>
    <button class="status-btn" id="btn-lang" type="button" aria-label="选择编程语言" hidden></button>
    <button class="status-btn" id="btn-speed" type="button"></button>
    <button class="status-btn" id="btn-auto" type="button" aria-pressed="false"></button>
    <button class="status-btn" id="btn-theme-name" type="button" aria-label="选择颜色主题"></button>
  </footer>

  <div class="quick" id="quick" role="dialog" aria-label="快速选择" hidden>
    <div class="quick-head">
      <span class="quick-title" id="quick-title">颜色主题</span>
      <div class="seg" id="quick-mode" role="group" aria-label="亮暗">
        <button type="button" data-mode="dark">深色</button>
        <button type="button" data-mode="light">浅色</button>
        <button type="button" data-mode="auto">跟随系统</button>
      </div>
    </div>
    <ul class="quick-list" id="quick-list" role="listbox" aria-label="选项"></ul>
    <div class="quick-foot" id="quick-foot"></div>
  </div>
</div>
